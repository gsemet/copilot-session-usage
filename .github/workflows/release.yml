name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version bump to apply"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch
      draft:
        description: "Create a draft release instead of publishing it"
        required: true
        type: boolean
        default: false
      force:
        description: "Force a patch release when auto finds no eligible commit"
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      INCREMENT: ${{ inputs.increment }}
      DRAFT_RELEASE: ${{ inputs.draft }}
      FORCE_RELEASE: ${{ inputs.force }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install release tooling
        run: uv sync --locked --all-groups

      - name: Calculate version and create tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The release branch is not clean. Refusing to create a release."
            git status --short
            exit 1
          fi

          git switch --force-create "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

          previous_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          if [[ -z "$previous_tag" ]]; then
            echo "::error::Could not find a previous release tag."
            exit 1
          fi

          if [[ "$INCREMENT" == "auto" ]]; then
            bump_args=(--get-next --yes)
            if [[ "$FORCE_RELEASE" == "true" ]]; then
              bump_args+=(--allow-no-commit)
            fi
            if ! next_version_output="$(uv run --no-sync cz bump "${bump_args[@]}" 2>&1)"; then
              echo "::error::No eligible conventional commits were found for an automatic release. You can either wait for a user-impacting feature or bug fix and start a new release, or enable 'Force a patch release when auto finds no eligible commit' when triggering the 'Release' Action."
              printf '%s\n' "$next_version_output"
              exit 1
            fi
          else
            echo "Using explicit $INCREMENT bump."
            next_version_output="$(uv run --no-sync cz bump --get-next \
              --increment "${INCREMENT^^}" --yes --allow-no-commit)"
          fi

          next_version="$(printf '%s\n' "$next_version_output" | tail -n 1)"
          if [[ ! "$next_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Commitizen returned an invalid next version: '$next_version'."
            printf '%s\n' "$next_version_output"
            exit 1
          fi

          target_tag="v$next_version"
          if [[ ! "$target_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::The calculated version did not create a semantic-version tag."
            exit 1
          fi
          if git rev-parse "$target_tag" >/dev/null 2>&1; then
            echo "::error::The tag $target_tag already exists."
            exit 1
          fi

          git tag "$target_tag"

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "Prepared local tag $target_tag from $previous_tag without modifying the default branch."

      - name: Generate release notes
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          TARGET_TAG: ${{ steps.version.outputs.target_tag }}
        run: |
          set -euo pipefail
          uv run -- python .github/skills/gh-release-notes/scripts/generate_release_notes.py \
            --from-ref "$PREVIOUS_TAG" \
            --to-ref "$TARGET_TAG" \
            --output release-notes.md

      - name: Upload generated notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.version.outputs.target_tag }}
          path: release-notes.md

      - name: Create GitHub release
        env:
          TARGET_TAG: ${{ steps.version.outputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $TARGET_TAG."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
            echo "::error::The remote tag $TARGET_TAG already exists."
            exit 1
          fi

          git push origin "$TARGET_TAG"

          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "$TARGET_TAG"
            --notes-file release-notes.md
          )
          if [[ "$DRAFT_RELEASE" == "true" ]]; then
            release_args+=(--draft)
          fi

          gh release create "$TARGET_TAG" "${release_args[@]}"

    outputs:
      target_tag: ${{ steps.version.outputs.target_tag }}

  publish:
    if: ${{ !inputs.draft }}
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/copilot-session-usage
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.target_tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
