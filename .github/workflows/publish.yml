name: Publish existing tag to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.7.1"
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/copilot-session-usage
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require the default branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$WORKFLOW_REF" != "$expected_ref" ]]; then
            echo "::error::PyPI publication must be dispatched from the default branch ($DEFAULT_BRANCH)."
            echo "::error::Received workflow ref: $WORKFLOW_REF"
            exit 1
          fi

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate and check out the requested tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a semantic-version tag such as v0.7.1, got '$TARGET_TAG'."
            exit 1
          fi
          if ! git ls-remote --exit-code --refs origin "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "::error::Remote tag $TARGET_TAG does not exist."
            exit 1
          fi

          git fetch --force origin "refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG"
          git fetch --force origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          target_commit="$(git rev-parse --verify "refs/tags/$TARGET_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$target_commit" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tag $TARGET_TAG is not reachable from the default branch."
            exit 1
          fi
          git checkout --detach "$target_commit"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Verify package version
        env:
          TARGET_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${TARGET_TAG#v}"
          shopt -s nullglob
          artifacts=(
            dist/copilot_session_usage-"$expected_version"-*.whl
            dist/copilot_session_usage-"$expected_version".tar.gz
          )
          if (( ${#artifacts[@]} != 2 )); then
            echo "::error::Built package artifacts do not match $TARGET_TAG."
            printf '%s\n' dist/*
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
