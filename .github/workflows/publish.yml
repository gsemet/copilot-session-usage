name: Publish existing tag to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.7.1"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/copilot-session-usage
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
